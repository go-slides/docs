# go-slides documentation (Hugo + Hextra), built like go-slides/docs,
# go-ndarray/docs and go-fileshare/docs.
#
# Each documentation version is a separate build under
# https://go-slides.github.io/docs/<version>/, where <version> is the minor
# version of go-slides/slides the pages describe (0.1, 0.2, ...), or "main" while no
# release is tagged. The CI sets it through --baseURL, from
# params.slides.version below. This default is the same build.
baseURL: "https://go-slides.github.io/docs/main/"
title: "go-slides"
# themes/hextra is the tannevaled/hextra fork, pinned at a release tag:
# upstream Hextra plus opt-in features (partial menu items, combos,
# related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

# English is the default language and stays at the root of each version
# (/docs/<version>/cli/); the others live under their code
# (/docs/<version>/fr/cli/), as in go-widgets/docs.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

# Each language has its own content directory, with the same file names, so
# that a page and its translation are paired; tools/i18n (run by the CI) fails
# when a page of content/en is missing in one of them, and checks that code,
# flags and anchors are what the English page has. A language is declared here
# only once its content exists. The flags are lipis/flag-icons' 4x3 flags (MIT,
# static/images/flags/LICENSE). Each language is listed under its own name.
# Chinese is Simplified (zh-Hans): the browser picks the right glyph variants
# of the Han characters from the page's lang.
languages:
  en:
    label: "English"
    contentDir: content/en
    weight: 1
    params:
      flag: images/flags/gb.svg
  fr:
    label: "Français"
    contentDir: content/fr
    weight: 2
    params:
      flag: images/flags/fr.svg
      dateFormat: "2 January 2006"
      description: "Des présentations compatibles Marp en Go pur (CGO=0), avec des gabarits Go et des types de diapositives."
  de:
    label: "Deutsch"
    contentDir: content/de
    weight: 3
    params:
      flag: images/flags/de.svg
      dateFormat: "2. January 2006"
      description: "Marp-kompatible Präsentationen in reinem Go (CGO=0), mit Go-Vorlagen und Folientypen."
  es:
    label: "Español"
    contentDir: content/es
    weight: 4
    params:
      flag: images/flags/es.svg
      dateFormat: "2 de January de 2006"
      description: "Presentaciones compatibles con Marp en Go puro (CGO=0), con plantillas de Go y tipos de diapositiva."
  zh:
    label: "简体中文"
    locale: zh-Hans
    contentDir: content/zh
    weight: 5
    params:
      flag: images/flags/cn.svg
      dateFormat: "2006年1月2日"
      description: "用纯 Go（CGO=0）编写、兼容 Marp 的幻灯片，支持 Go 模板和幻灯片类型。"
  ko:
    label: "한국어"
    contentDir: content/ko
    weight: 6
    params:
      flag: images/flags/kr.svg
      dateFormat: "2006년 1월 2일"
      description: "순수 Go(CGO=0)로 만든 Marp 호환 슬라이드. Go 템플릿과 슬라이드 유형을 지원합니다."
  ja:
    label: "日本語"
    contentDir: content/ja
    weight: 7
    params:
      flag: images/flags/jp.svg
      dateFormat: "2006年1月2日"
      description: "純粋な Go（CGO=0）で書かれた Marp 互換のスライド。Go テンプレートとスライドの種類に対応します。"

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the bottom of each page.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
  highlight:
    noClasses: false

module:
  hugoVersion:
    extended: false
    min: 0.146.0
  # The marks and favicons come from the go-slides brand repository
  # (submodule branding/), published under /images/brand/. Only the org mark's
  # colour formats are mounted.
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    - source: branding/svg/color
      target: static/images/brand/svg
      files: ["go-slides.svg"]
    - source: branding/png/color
      target: static/images/brand/png
      files: ["*/go-slides.png"]
    - source: branding/ico
      target: static/images/brand/ico
      files: ["go-slides.ico"]

menu:
  main:
    # Navbar, left to right: version, language, theme, search, sources.
    - name: Version
      weight: 3
      params:
        type: partial
        partial: custom/version-select.html
    - name: Language
      weight: 4
      params:
        type: language-switch
        label: true
        combo: true
        icon: translate
    - name: Theme
      weight: 5
      params:
        type: theme-toggle
        combo: true
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      url: https://github.com/go-slides/slides
      weight: 7
      params:
        icon: github

params:
  description: "Marp-compatible slide decks in pure Go (CGO=0), with Go template interpolation and slide kinds."

  # The go-slides/slides release these pages describe. Its minor version is
  # the documentation's version label (v0.1.2 -> 0.1): the CI reads it here.
  # "main" while nothing is released: the pages then describe the branch
  # being written, and say so.
  slides:
    version: "v0.14.0"
  # The ref of go-slides/slides whose examples/ the gallery shows, and from
  # which tools/gallery builds the slides command that renders the thumbnails
  # (the CI reads it here). "main" until a release has an examples/ folder;
  # then the release's tag, so that the gallery matches the pages.
  gallery:
    ref: "main"
  # The language switch shows the translate icon, then the language's flag.
  # It appears once a second language is declared (languages: above).
  languageSwitch:
    icon: translate
    # Once, in the navbar beside the theme toggle: not also at the foot of the
    # sidebar. On a phone the navbar's combo keeps its icon and chevron.
    location: navbar
  versions:
    # The version selector shows "main" with the development icon.
    development: "main"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # The indigo mark reads on both themes; the name is the site title.
      path: images/brand/svg/go-slides.svg
      dark: images/brand/svg/go-slides.svg
      width: 32
      height: 32
      # Related sites, opened from the chevron beside the title (the logo itself
      # leads to the documentation's home).
      menu:
        - name: go-slides
          url: https://go-slides.github.io/
          logo: images/brand/svg/go-slides.svg
        # The sister orgs' marks are their brand repositories' svg/color files,
        # copied verbatim into static/images/brand/svg/ (go-slides' own comes
        # through the branding submodule).
        - name: go-tex
          url: https://go-tex.github.io/
          logo: images/brand/svg/go-tex.svg
        - name: go-richdoc
          url: https://go-richdoc.github.io/
          logo: images/brand/svg/go-richdoc.svg
        - name: go-docutils
          url: https://go-docutils.github.io/
          logo: images/brand/svg/go-docutils.svg
        - name: go-pdfkit
          url: https://go-pdfkit.github.io/
          logo: images/brand/svg/go-pdfkit.svg

  theme:
    default: system
    # The theme toggle is in the navbar (menu above), not at the foot of the sidebar.
    displayToggle: false
    # Dark Reader would darken the light theme itself; with the lock, the dark
    # theme is our own.
    darkreaderLock: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: true
    base: "https://github.com/go-slides/docs/edit/main/content"

  toc:
    displayTags: true

  page:
    width: normal
    # The front matter description as a subtitle under the title.
    displayDescription: true
    # "Created on ... by ... · Modified on ... by ..." at the foot of each page:
    # creation from data/pagehistory.json, which the build writes with
    # themes/hextra/scripts/page-history.sh (it needs the full git history);
    # modification from git (enableGitInfo).
    history: true
    contextMenu:
      enable: false

  highlight:
    copy:
      enable: true
      display: hover

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
